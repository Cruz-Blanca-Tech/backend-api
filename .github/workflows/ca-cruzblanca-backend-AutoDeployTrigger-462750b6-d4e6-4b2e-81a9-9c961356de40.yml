name: Trigger auto deployment for ca-cruzblanca-backend

on:
  push:
    branches: 
      [ main ]
  workflow_dispatch:      

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarQube necesita el historial para analizar el código nuevo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Igual que el Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (con cobertura)
        # pytest.ini limita la colección a tests/ (los scripts de scratch/
        # no se recogen ni interfieren). Genera coverage.xml para SonarQube.
        run: pytest -q --cov=src --cov-report=xml

      - name: SonarQube Cloud Scan + Quality Gate
        # qualitygate.wait=true hace que este paso FALLE si el Quality Gate
        # no pasa; como build-and-deploy tiene `needs: test`, no se despliega.
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test   # Quality gate: no se despliega si fallan los tests o el Quality Gate de SonarQube
    permissions: 
      id-token: write 
      contents: read 

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4 # Corregido: antes decía actions/actions/checkout

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CACRUZBLANCABACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CACRUZBLANCABACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CACRUZBLANCABACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: './Dockerfile'
          registryUrl: 'cruzblanca2026.azurecr.io' # Puse el nombre que vimos antes
          registryUsername: ${{ secrets.CACRUZBLANCABACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CACRUZBLANCABACKEND_REGISTRY_PASSWORD }}
          containerAppName: ca-cruzblanca-backend
          resourceGroup: rg-ocr-cruzblanca
          imageToBuild: cruzblanca2026.azurecr.io/ca-cruzblanca-backend:${{ github.sha }}
