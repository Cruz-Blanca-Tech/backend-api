sonar.organization=cruz-blanca-tech
sonar.projectKey=Cruz-Blanca-Tech_backend-api
sonar.projectName=Cruz Blanca - Backend API

# Directorios de código y tests
sonar.sources=src
sonar.tests=tests

# Codificación y versiones
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Exclusiones
sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/scratch/**,**/alembic/**,**/scripts/**,**/*.xlsx,**/*.json,**/*.csv
sonar.coverage.exclusions=tests/**,alembic/**,scratch/**,scripts/**

# Reporte de cobertura generado por pytest-cov
sonar.python.coverage.reportPaths=coverage.xml
